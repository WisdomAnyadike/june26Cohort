<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title># general — Cohort Chat</title>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-database-compat.js"></script>
</head>
<body class="chat-page">

  <!-- ==========================================================
       Header — the room tab on the left, log out on the right
       ========================================================== -->
  <header class="chat-head">
    <div class="inner head-inner">

      <a href="../index.html" class="brand">
        <span>S</span>
        <em class="brand-text">Cohort Chat</em>
      </a>

      <a href="#" class="tab"><i class="hash">#</i> general</a>

      <div class="head-right">

        <div class="head-user">
          <div class="avatar c1" id="myAvatar"> ... </div>
          <div>
            <p class="name" id="myName">Wisdom A.</p>
            <p class="status"><span class="dot"></span> Online</p>
          </div>
        </div>

        <button onclick="logUserOut()" class="btn btn-ghost btn-sm">Log out</button>

      </div>

    </div>
  </header>

  <!-- ==========================================================
       The conversation
       ========================================================== -->
  <main class="stream" id="stream">
    <div class="inner">

      <!-- Welcome the person who just logged in -->
      <div class="welcome-note">
        <p class="pill"><span class="dot"></span> You're in</p>
        <h2>Welcome, <span class="user-name"> loading... </span> 👋</h2>
        <p>
          You have joined <b>#general</b> — the main room for the June '26 JavaScript
          cohort. Say hello, ask anything, and be kind to whoever is stuck.
        </p>
      </div>

      <div class="day">Today</div>

     
      <div class="messages" id="messages">

      


      </div>
   
      

    </div>
  </main>

  <!-- ==========================================================
       Composer
       ========================================================== -->
  <div class="composer-bar">
    <form class="inner composer">
      <input type="text" class="composer-input" id="messageInput" placeholder="Message #general" />
      <button type="button" class="btn" id="sendButton" onclick="sendMssg()">Send</button>
    </form>
  </div>

</body>
</html>
<script src="../js/dashboard.js"> </script>
